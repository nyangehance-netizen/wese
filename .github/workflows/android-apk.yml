# Builds an installable Android APK of the Wese app on every push to main
# (or by hand from the Actions tab), then publishes it as the "wese-preview" release.
# Download it on your phone from: https://github.com/<you>/<repo>/releases/tag/wese-preview
name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wese-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package.json', 'mobile/app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install packages
        run: npm run setup

      - name: Add Firebase config for push notifications (optional)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > google-services.json; echo "Firebase config added"
          else echo "No GOOGLE_SERVICES_JSON secret: the app builds without remote push (demo alerts still work)"; fi

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'http://192.168.1.20:4000' }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}

      - name: Build APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'http://192.168.1.20:4000' }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk ../out/wese-preview.apk
          ls -lh ../out

      - name: Keep a copy on this run
        uses: actions/upload-artifact@v4
        with:
          name: wese-preview-apk
          path: out/wese-preview.apk

      - name: Publish as the "wese-preview" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wese-preview --yes --cleanup-tag || true
          gh release create wese-preview out/wese-preview.apk \
            --target "$GITHUB_SHA" \
            --title "Wese preview build" \
            --notes "Android preview built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Download wese-preview.apk on your phone and install it. Tap Try the demo on the sign-in screen to explore with sample data, or set your server address under Server settings." \
            --prerelease
